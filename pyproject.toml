[project]
name = "agentic-document-intelligence-platform"
version = "0.1.0"
description = "Enterprise-grade multi-agent document intelligence platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13.2",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "azure-identity>=1.17.1",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "langchain>=0.2.11",
  "langchain-openai>=0.1.19",
  "langgraph>=0.2.3",
  "motor>=3.5.1",
  "numpy>=1.26.4",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-sdk>=1.26.0",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.3.1",
  "python-pptx>=0.6.23",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "sqlalchemy[asyncio]>=2.0.32",
  "structlog>=24.4.0",
  "tenacity>=8.5.0",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.5",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7",
]
data = [
  "pyspark>=3.5.1",
]
ocr = [
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
